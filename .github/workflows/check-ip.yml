name: Check runner IP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Show public IP and country
        shell: pwsh
        run: |
          $result = Invoke-RestMethod "https://ipinfo.io/json"
          Write-Host "Public IP: $($result.ip)"
          Write-Host "Country: $($result.country)"
